name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile, test and build docs
        run: sbt -batch +test doc
      - name: Check that the publishable artifacts build
        run: sbt -batch publishLocal

  vector25:
    # Optional Vector API backend: JDK 25 only, never part of the JDK 17 root build above.
    name: vector25 backend (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test the vector25 backend and compile the benchmarks
        run: sbt -batch vector25/test benchmarks/Jmh/compile
