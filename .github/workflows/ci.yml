name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile, test and build docs
        run: sbt -batch +test doc
      - name: Check that the publishable artifacts build
        run: sbt -batch publishLocal
